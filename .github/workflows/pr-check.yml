name: PR check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # dist/ IS git-tracked — see the note in .gitignore. All three
      # consumers install via `github:flatie-tech/flatie-shared#vX.Y.Z`,
      # where the `prepare` script (`test -d dist || tsup`) is a no-op
      # because devDependencies aren't installed in a nested git dep, so
      # the committed bytes ship verbatim.
      #
      # This job deliberately does NOT diff dist/ against src/. dist is
      # rebuilt at release time, not per PR: scripts/release.mjs runs
      # `pnpm build` and stages dist/ before tagging, so the TAG — never
      # an intermediate main commit — is the unit of distribution. A
      # `git diff --exit-code -- dist/` step here would fail every normal
      # src-only PR. The build step above only proves src/ still compiles.

  docs-check:
    name: Doc hygiene
    runs-on: ubuntu-latest
    # Reminders + CLAUDE.md lint. Lint failure blocks merge; doc-hygiene
    # script only prints reminders. Strict cross-repo verifiers live in
    # flatie-tech/flatie-docs CI (Phase E).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run doc-hygiene reminders (non-blocking)
        run: bash scripts/check-doc-hygiene.sh
      - name: Lint CLAUDE.md (blocking)
        run: bash scripts/lint-claude-md.sh
